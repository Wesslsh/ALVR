name: Build depth mask streamer and client

on:
  workflow_dispatch:
  push:
    branches: [depth-mask-passthrough]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install zip unzip pkgconfiglite

      - name: Prepare deps
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask prepare-deps --platform windows

      - name: Build and package ALVR streamer (.zip)
        env:
          RUST_BACKTRACE: 1
        run: |
          mkdir artifacts/
          cargo xtask build-streamer --platform windows --release --ci
          zip -r9X artifacts/alvr_streamer_windows.zip ./build/alvr_streamer*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: alvr_streamer_windows
          path: ./artifacts/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-32"

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Prepare deps
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask prepare-deps --platform android

      - name: Build client
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        working-directory: ./alvr/client_openxr
        run: cargo xtask build-client --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: alvr_client_quest_apk
          path: ./build/alvr_client_android/alvr_client_android.apk
